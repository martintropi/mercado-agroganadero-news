# .github/workflows/cron.yml
name: Scrape Agrofy News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

# --- AÑADE ESTE BLOQUE ---
# Otorga permisos de escritura al workflow para que pueda hacer "push"
permissions:
  contents: write
# -------------------------

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona tu repositorio
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Configura Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Instala las dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Ejecuta tu script de scraping
      - name: Run scraper
        run: python scraper.py

      # 5. Guarda los cambios en el repositorio
      - name: Commit and push if there are changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          # Solo hace commit si hay cambios en el archivo
          git diff --staged --quiet || git commit -m "Actualizar noticias (Automático)"
          git push
